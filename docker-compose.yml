# DeepSeek Harness —— 多用户部署编排
#
# 本文件只定义「结构」，具体「配置值」全部来自同目录的 .env 文件。
# 这样密钥不会进入被 git 跟踪的文件，可以安全提交到公开仓库。
#
# 使用：
#   cp .env.example .env     # 首次：复制模板
#   vi .env                  # 填写模型地址与密钥
#   docker compose up -d
#
# .env 由 docker compose 自动加载，无需任何额外参数。
# 若某个变量在 .env 中缺失，下方 ${VAR:-默认值} 里的默认值会生效。

services:
  dsh:
    # 本地已构建的镜像。改用 Docker Hub 上的公开镜像时，在 .env 里设：
    #   DSH_IMAGE=dockertest416/dsh-harness:0.1.5-rc.1
    image: "${DSH_IMAGE:-dsh-harness:0.1.5-rc.1}"
    container_name: dsh
    restart: unless-stopped

    ports:
      # 宿主机端口。对外端口在 .env 里改 DSH_PORT，如 DSH_PORT=80
      - "${DSH_PORT:-8080}:8080"

    environment:
      # ── 模型接入 ────────────────────────────────────────────────────────
      # 唯一必填项。未设置时 compose 会直接报错，而不是启动后才失败。
      DSH_LLM_BASE_URL: "${DSH_LLM_BASE_URL:?请在 .env 中设置 DSH_LLM_BASE_URL}"

      DSH_LLM_API_KEY: "${DSH_LLM_API_KEY:-sk-intranet}"
      DSH_LLM_MODEL: "${DSH_LLM_MODEL:-deepseek-flash}"
      # 额外可切换的模型，逗号分隔；留空则只暴露上面那一个
      DSH_LLM_MODELS: "${DSH_LLM_MODELS:-}"
      DSH_LLM_PROVIDER_LABEL: "${DSH_LLM_PROVIDER_LABEL:-模型服务}"

      # 上下文窗口。越长单次请求越贵，agent 会话很容易撑满，建议按需设置。
      DSH_LLM_CONTEXT_WINDOW: "${DSH_LLM_CONTEXT_WINDOW:-131072}"
      # 单次最大输出。思考模式下推理过程也占这里的额度，设太小会截断长输出。
      DSH_LLM_MAX_TOKENS: "${DSH_LLM_MAX_TOKENS:-32768}"

      # ── 兼容开关（模型服务不兼容时的调节点）─────────────────────────────
      DSH_LLM_SUPPORTS_DEVELOPER_ROLE: "${DSH_LLM_SUPPORTS_DEVELOPER_ROLE:-false}"
      DSH_LLM_MAX_TOKENS_FIELD: "${DSH_LLM_MAX_TOKENS_FIELD:-max_tokens}"
      # 仅 DeepSeek 系模型需要；其他服务留空
      DSH_LLM_THINKING_FORMAT: "${DSH_LLM_THINKING_FORMAT:-}"
      DSH_LLM_REASONING_EFFORT: "${DSH_LLM_REASONING_EFFORT:-}"

      # ── 配置归属 ────────────────────────────────────────────────────────
      # 默认（留空）：同事可在界面上自行改模型，改动保留。
      # 设为 1：每次启动都用 .env 重新生成，同事改不动（管理员统一管控）。
      DSH_CONFIG_OVERWRITE: "${DSH_CONFIG_OVERWRITE:-}"

      # ── 授权与容量 ──────────────────────────────────────────────────────
      GATEWAY_SESSION_TTL_HOURS: "${GATEWAY_SESSION_TTL_HOURS:-12}"
      GATEWAY_IDLE_MINUTES: "${GATEWAY_IDLE_MINUTES:-30}"
      # 每个在线用户是一个独立 dsh 进程，实测约 600MB；无人在线时约 90MB
      GATEWAY_MAX_INSTANCES: "${GATEWAY_MAX_INSTANCES:-10}"

    volumes:
      # 授权库、每位用户的会话历史与配置
      - dsh-data:/data
      # 每位用户的工作目录，位于 ./workspaces/<备注>-<授权码后缀>/
      - ./workspaces:/workspace

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/__auth/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  dsh-data:
